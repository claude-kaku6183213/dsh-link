name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk dsh.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-apk
          path: dsh.apk
      - name: Publish release (latest APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: DSH APK (latest)
          body: Latest DSH Android app build. Download dsh.apk and install.
          files: dsh.apk
          make_latest: true
